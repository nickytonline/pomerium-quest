name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      # The router plugin generates routeTree.gen.ts during a build; the type check needs it.
      - run: npm run build -w app
      - run: npm run check
      - run: npm test
